<!DOCTYPE html>
<html>
<head>
    <title>Live Trading Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>Paper Trading Results</h2>
        <p>Results from our live trading week (July 2024)</p>

        <div class="row">
            <div class="col-md-8">
                <canvas id="portfolioChart"></canvas>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Performance Summary</h5>
                        <p><strong>Initial Value:</strong> $100,000</p>
                        <p><strong>Final Value:</strong> <span id="finalValue">Loading...</span></p>
                        <p><strong>Total Return:</strong> <span id="totalReturn">Loading...</span></p>
                        <p><strong>Best Model:</strong> <span id="bestModel">Loading...</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h4>Recent Trading Decisions</h4>
            <table class="table" id="tradingTable">
                <thead>
                    <tr><th>Date</th><th>Model</th><th>Action</th><th>Stock</th><th>Explanation</th></tr>
                </thead>
                <tbody id="tradingBody">
                    <!-- Will be filled by JavaScript -->
                </tbody>
            </table>
        </div>

        <a href="index.html" class="btn btn-secondary">← Back to Home</a>
    </div>

    <script>
        // This will either fetch from AWS API or read from JSON file
        async function loadTradingData() {
            try {
                // During live period: fetch from AWS
                // After shutdown: read from local file
                const response = await fetch('./data/trading-results.json');
                const data = await response.json();
                displayData(data);
            } catch (error) {
                // Fallback to dummy data for demo
                displayDummyData();
            }
        }

        function displayData(data) {
            // Create portfolio value chart
            const dates = data.map(item => new Date(item.timestamp).toLocaleDateString());
            const values = data.map(item => item.portfolio_value);

            new Chart(document.getElementById('portfolioChart'), {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Portfolio Value',
                        data: values,
                        borderColor: '#36A2EB',
                        backgroundColor: 'rgba(54, 162, 235, 0.1)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { 
                            beginAtZero: false,
                            ticks: { 
                                callback: function(value) { return '$' + value.toLocaleString(); }
                            }
                        }
                    }
                }
            });

            // Update summary stats
            document.getElementById('finalValue').textContent = '$' + values[values.length - 1].toLocaleString();
            const returnPercent = ((values[values.length - 1] - values[0]) / values[0] * 100).toFixed(2);
            document.getElementById('totalReturn').textContent = returnPercent + '%';
            document.getElementById('bestModel').textContent = 'PPO'; // You'll calculate this

            // Fill trading table
            const tbody = document.getElementById('tradingBody');
            data.slice(-10).forEach(item => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${new Date(item.timestamp).toLocaleDateString()}</td>
                    <td>${item.best_model || 'Ensemble'}</td>
                    <td>${item.action || 'Hold'}</td>
                    <td>${item.stock || 'AAPL'}</td>
                    <td>RSI indicated oversold condition</td>
                `;
            });
        }

        function displayDummyData() {
            // Dummy data for demonstration
            const dummyData = [];
            const startValue = 100000;
            for (let i = 0; i < 30; i++) {
                dummyData.push({
                    timestamp: new Date(Date.now() - (30-i) * 24 * 60 * 60 * 1000),
                    portfolio_value: startValue + (Math.random() - 0.5) * 10000 + i * 300
                });
            }
            displayData(dummyData);
        }

        // Load data when page loads
        loadTradingData();
    </script>
</body>
</html>
