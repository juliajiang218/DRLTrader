<!DOCTYPE html>
<html>
<head>
    <title>Model Demonstrations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>Model Demonstrations & Explainability</h2>
        
        <!-- A2C Model Demo -->
        <div class="row mb-5">
            <div class="col-md-6">
                <h4>A2C Model</h4>
                <video width="100%" controls>
                    <source src="videos/a2c-demo.mp4" type="video/mp4">
                    Your browser doesn't support video.
                </video>
            </div>
            <div class="col-md-6">
                <h5>Feature Importance (SHAP)</h5>
                <canvas id="a2cChart"></canvas>
            </div>
        </div>

        <!-- PPO Model Demo -->
        <div class="row mb-5">
            <div class="col-md-6">
                <h4>PPO Model</h4>
                <video width="100%" controls>
                    <source src="videos/ppo-demo.mp4" type="video/mp4">
                </video>
            </div>
            <div class="col-md-6">
                <h5>Feature Importance (SHAP)</h5>
                <canvas id="ppoChart"></canvas>
            </div>
        </div>

        <!-- DDPG Model Demo -->
        <div class="row mb-5">
            <div class="col-md-6">
                <h4>DDPG Model</h4>
                <video width="100%" controls>
                    <source src="videos/ddpg-demo.mp4" type="video/mp4">
                </video>
            </div>
            <div class="col-md-6">
                <h5>Feature Importance (SHAP)</h5>
                <canvas id="ddpgChart"></canvas>
            </div>
        </div>

        <a href="index.html" class="btn btn-secondary">← Back to Home</a>
    </div>

    <script>
        // Simple SHAP-like feature importance charts
        const features = ['Close Price', 'Volume', 'RSI', 'MACD', 'Balance'];
        
        // A2C importance values (you'll replace with real SHAP values)
        new Chart(document.getElementById('a2cChart'), {
            type: 'bar',
            data: {
                labels: features,
                datasets: [{
                    data: [0.4, 0.15, 0.25, 0.12, 0.08],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, max: 1 } }
            }
        });

        // PPO chart (different values)
        new Chart(document.getElementById('ppoChart'), {
            type: 'bar',
            data: {
                labels: features,
                datasets: [{
                    data: [0.35, 0.20, 0.18, 0.15, 0.12],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, max: 1 } }
            }
        });

        // DDPG chart
        new Chart(document.getElementById('ddpgChart'), {
            type: 'bar',
            data: {
                labels: features,
                datasets: [{
                    data: [0.30, 0.25, 0.20, 0.15, 0.10],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, max: 1 } }
            }
        });
    </script>
</body>
</html>
